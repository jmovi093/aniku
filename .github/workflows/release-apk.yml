name: Build Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: "Publicar el APK como prerelease de prueba (no toca la versión de la app)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caché de Gradle. IMPORTANTE (por si genera dudas a futuro):
      # solo se cachea ~/.gradle, que son las DEPENDENCIAS descargadas y el
      # wrapper — NO se cachea android/app/build (los artefactos compilados).
      # Además android/ no está en git: lo regenera `expo prebuild` en cada run.
      # Consecuencias:
      #   · nunca se reutiliza un compilado viejo → no puede "funcionar y de
      #     repente dejar de funcionar" por caché rancia;
      #   · si la caché se borra o vence, el build solo tarda más (re-descarga);
      #   · Gradle valida checksums de lo que restaura, si algo no cuadra lo baja.
      # Para invalidarla a mano: Actions → Caches, o `gh cache delete <key>`.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'patches/**') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Validate patches (syntax check)
        run: node scripts/validate-patches.js

      - name: Generate Android project with Expo prebuild
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: ./node_modules/.bin/expo prebuild --platform android --no-install

      - name: Build release APK
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aniku-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk

      # Build de prueba: se dispara a mano desde cualquier rama y publica un
      # PRERELEASE con tag propio (test-*). NO toca package.json ni app.json,
      # no mueve la versión de la app y GitHub no lo marca como "Latest".
      # Sirve para instalar el APK desde el celular sin estar en la compu.
      - name: Publicar prerelease de prueba
        if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: "🧪 Test build #${{ github.run_number }} — ${{ github.ref_name }}"
          prerelease: true
          body: |
            Build de prueba automático — **no es un release de la app**.
            No altera la versión ni aparece como "Latest release".

            | | |
            |---|---|
            | Rama | `${{ github.ref_name }}` |
            | Commit | `${{ github.sha }}` |
            | Run | #${{ github.run_number }} |

            Descargar el `.apk` de acá abajo e instalarlo directo en el celular.
          files: android/app/build/outputs/apk/release/*.apk
